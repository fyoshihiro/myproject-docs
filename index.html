<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Docs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" />
    <style>
        @media screen and (max-width: 768px) {
            body {
                font-size: 15px;
            }
            .markdown-section {
                padding: 5px 5px 10px;
            }
            .markdown-section pre {
                font-size: 12px;
            }
            #docsify-darklight-theme {
                left: auto !important;
                right: 5px !important;
            }
            scrollToTop: {
                auto: true,
                text: 'Top',
                right: 5,
                bottom: 10,
                offset: 500
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            homepage: "README.md",
            loadSidebar: true,
            search: 'auto'
        };
    </script>
    <button id="backToTop" style="
    position:fixed; right:20px; bottom:20px;
    width:44px; height:44px; border-radius:50%;
    border:none; background:var(--accent,#42b983); color:#fff;
    font-size:20px; cursor:pointer; z-index:9999; display:none;
">↑</button>

<script>
  const btn = document.getElementById('backToTop');
  const getScrollBox = () => document.querySelector('.content') || window;

  function toggleBtn() {
    const box = getScrollBox();
    const top = box === window ? window.scrollY : box.scrollTop;
    btn.style.display = top > 300 ? 'block' : 'none';
  }

  document.addEventListener('scroll', toggleBtn, true);

  btn.addEventListener('click', () => {
    const box = getScrollBox();
    box.scrollTo({ top: 0, behavior: 'smooth' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-progress@latest/dist/progress.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-plugin-github-alert/dist/index.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <!-- Mermaid対応 -->
    <script src="//unpkg.com/mermaid/dist/mermaid.min.js"></script>
    <script src="//unpkg.com/docsify-mermaid@latest/dist/docsify-mermaid.js"></script>
</body>
</html>
