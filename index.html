<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Docs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />
</head>

<body>
    <div id="app"></div>
    <script>
